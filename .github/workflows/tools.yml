# This workflow is used to build and upload the node bootstrapping tools
name: Build Tools

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/commit'
        required: true
        type: string
      promote:
        description: 'Promote to official boot-tools?'
        required: false
        type: boolean

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS STS

env:
  GO_VERSION: "1.26"
  # Public mirror of gs://flow-genesis-bootstrap. Bucket lives in flow-common
  # (us-east-2) and is public-read over HTTPS; write access is restricted to
  # this workflow via the OIDC role AWS_GENESIS_BOOTSTRAP_PUSH_ROLE_ARN.
  BOOTSTRAP_BUCKET: flow-genesis-bootstrap
  AWS_REGION: us-east-2

jobs:
  build-publish:
    name: Build boot tools
    runs-on: ubuntu-latest
    steps:
    - name: Print all input variables
      run: echo '${{ toJson(inputs) }}' | jq
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_GENESIS_BOOTSTRAP_PUSH_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        # to accurately get the version tag
        fetch-depth: 0
        ref: ${{ inputs.tag }}
    - name: Build and upload boot-tools
      env:
        CADENCE_DEPLOY_KEY: ${{ secrets.CADENCE_DEPLOY_KEY }}
      run: |
        make tool-bootstrap tool-transit
        mkdir boot-tools
        mv bootstrap transit boot-tools/
        sha256sum boot-tools/bootstrap > boot-tools/bootstrap.sha256sum
        cat boot-tools/bootstrap.sha256sum
        sha256sum boot-tools/transit > boot-tools/transit.sha256sum
        cat boot-tools/transit.sha256sum
        tar -czf boot-tools.tar ./boot-tools/
        aws s3 cp boot-tools.tar s3://${BOOTSTRAP_BUCKET}/tools/${{ inputs.tag }}/boot-tools.tar
    - name: Build and upload util
      env:
        CADENCE_DEPLOY_KEY: ${{ secrets.CADENCE_DEPLOY_KEY }}
      run: |
        make tool-util
        sha256sum util > util.sha256sum
        cat util.sha256sum
        tar -czf util.tar util util.sha256sum
        aws s3 cp util.tar s3://${BOOTSTRAP_BUCKET}/tools/${{ inputs.tag }}/util.tar
    - name: Promote boot-tools
      run: |
        if [[ "${{ inputs.promote }}" = true ]]; then
          echo "promoting boot-tools.tar"
          aws s3 cp boot-tools.tar s3://${BOOTSTRAP_BUCKET}/boot-tools.tar
          SUMMARY=$'# Tool Build and Upload Summary \n Your tools were uploaded to the following S3 objects \n * Boot Tools s3://'"${BOOTSTRAP_BUCKET}"$'/boot-tools.tar \n * Util util.tar s3://'"${BOOTSTRAP_BUCKET}"$'/tools/${{ inputs.tag }}/util.tar'
        else
          echo "not promoting boot-tools.tar"
          SUMMARY=$'# Tool Build and Upload Summary \n Your tools were uploaded to the following S3 objects \n * Boot Tools s3://'"${BOOTSTRAP_BUCKET}"$'/tools/${{ inputs.tag }}/boot-tools.tar \n * Util util.tar s3://'"${BOOTSTRAP_BUCKET}"$'/tools/${{ inputs.tag }}/util.tar'
        fi
        echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
